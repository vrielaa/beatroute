<app-cluster-control
  [minClusterCount]="minClusterCount"
  [maxClusterCount]="maxClusterCount()"
  [selectedClusterCount]="selectedClusterCount()"
  [isLoading]="isLoading()"
  (clusterCountChange)="updateClusterCount($event)"
></app-cluster-control>

@if (progress() || errorMessage()) {
  <app-listening-tracks-feedback
    [progress]="progress()"
    [message]="errorMessage()"
    [hasError]="errorMessage() !== null"
    (retryRequested)="retryLoading()"
  ></app-listening-tracks-feedback>
}

@if (isLoading()) {
  <section class="music-map-loading-card card" aria-label="Ładowanie mapy muzycznej">
    <span class="skeleton music-map-loading-plot"></span>
  </section>
} @else if (!errorMessage()) {
  @if (musicMap(); as map) {
    <app-music-map-chart
      [points]="map.points"
      [selectedClusterId]="selectedClusterId()"
    ></app-music-map-chart>

    <app-cluster-details
      [clusterDetails]="clusterDetails()"
      [selectedClusterId]="selectedClusterId()"
      (clusterSelect)="selectCluster($event)"
    ></app-cluster-details>

    <app-music-map-methodology [musicMap]="map"></app-music-map-methodology>
  } @else {
    <section class="music-map-state-card card">
      <p>
        {{
          progress()?.totalItems === 0
            ? 'Brak utworów w tym okresie.'
            : 'Brak kompletnych pomiarów do mapy.'
        }}
      </p>
    </section>
  }
}
