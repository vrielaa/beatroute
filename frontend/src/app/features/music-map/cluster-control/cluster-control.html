<div class="music-map-section-heading">
  <h2>Kontrola Klastrowania</h2>
  <p>Dostosuj liczbę klastrów (k) dla algorytmu K-means</p>
</div>

<div class="cluster-control-slider">
  <label for="music-map-cluster-count">Liczba klastrów:</label>
  <input
    #clusterCountSlider
    id="music-map-cluster-count"
    type="range"
    [min]="minClusterCount()"
    [max]="maxClusterCount()"
    step="1"
    [value]="displayedClusterCount()"
    [disabled]="isLoading() || hasOnlyOneAvailableValue()"
    (input)="previewClusterCount(clusterCountSlider.valueAsNumber)"
    (change)="selectClusterCount(clusterCountSlider.valueAsNumber)"
  />
  <strong>{{ displayedClusterCount() }}</strong>
</div>

@if (hasOnlyOneAvailableValue()) {
<p class="cluster-control-limit-message">
  Obecne dane pozwalają utworzyć maksymalnie {{ maxClusterCount() }} klastry.
</p>
}
