@if (hasAudioFeatures()) {
<details class="most-listened-track-details">
  <summary class="most-listened-track-row most-listened-track-row--expandable">
    <span class="most-listened-track-rank">
      {{ index() + 1 }}
    </span>

    <span class="most-listened-track-primary-info">
      <span class="most-listened-track-name">
        {{ track().name }}
      </span>
      <span class="most-listened-track-mobile-artists">
        {{ artistNames() }}
      </span>
    </span>

    <span class="most-listened-track-desktop-artists">
      {{ artistNames() }}
    </span>

    <span class="most-listened-track-expand-indicator" aria-hidden="true">
      +
    </span>
  </summary>

  <div class="most-listened-track-feature-panel">
    <dl class="most-listened-track-features">
      @for (feature of featureRows(); track feature.label) {
      <div class="most-listened-track-feature-card">
        <dt>
          <app-tooltip [content]="feature.tooltip">{{ feature.label }}</app-tooltip>
        </dt>
        <dd>{{ feature.value }}</dd>
      </div>
      }
    </dl>
  </div>
</details>
} @else {
<div class="most-listened-track-row">
  <span class="most-listened-track-rank">
    {{ index() + 1 }}
  </span>

  <span class="most-listened-track-primary-info">
    <span class="most-listened-track-name">
      {{ track().name }}
    </span>
    <span class="most-listened-track-mobile-artists">
      {{ artistNames() }}
    </span>
  </span>

  <span class="most-listened-track-desktop-artists">
    {{ artistNames() }}
  </span>

  <span aria-hidden="true"></span>
</div>
}
