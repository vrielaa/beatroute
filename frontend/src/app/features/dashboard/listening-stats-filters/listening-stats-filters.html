<div class="listening-stats-filters-heading">
  <app-icon class="listening-stats-filters-heading-icon" name="settings" />

  <h3 class="listening-stats-filters-title">Ustawienia parametrów do analizy</h3>
</div>

<form class="listening-stats-time-range-field">
  <label class="listening-stats-filter-label" for="period-select">Wybierz zakres</label>
  <div class="listening-stats-filter-select-shell">
    <select
      id="period-select"
      class="listening-stats-filter-select"
      (change)="selectTimeRange($event)"
      [value]="selectedTimeRange()"
    >
      <option class="listening-stats-filter-option" value="short_term">Ostatni miesiąc</option>
      <option class="listening-stats-filter-option" value="medium_term">Ostatnie 6 miesięcy</option>
      <option class="listening-stats-filter-option" value="long_term">Ostatni rok</option>
    </select>
    <span class="listening-stats-filter-select-arrow" aria-hidden="true"></span>
  </div>
</form>

<form class="listening-stats-range-form">
  <div class="listening-stats-range-field">
    <label class="listening-stats-filter-label" for="tracks-range-input">Liczba utworów</label>

    <div class="listening-stats-range-controls">
      <input
        id="tracks-range-input"
        class="listening-stats-number-input"
        type="number"
        min="1"
        max="40"
        [value]="selectedTracksRange()"
        (input)="selectTracksRange($event)"
      />

      <input
        id="tracks-range-slider"
        class="listening-stats-range-input"
        type="range"
        min="1"
        max="40"
        step="1"
        [value]="selectedTracksRange()"
        (input)="selectTracksRange($event)"
      />
    </div>
  </div>

  <div class="listening-stats-range-field">
    <label class="listening-stats-filter-label" for="artists-range-input">Liczba artystów</label>

    <div class="listening-stats-range-controls">
      <input
        id="artists-range-input"
        class="listening-stats-number-input"
        type="number"
        min="1"
        max="40"
        [value]="selectedArtistsRange()"
        (input)="selectArtistsRange($event)"
      />

      <input
        id="artists-range-slider"
        class="listening-stats-range-input"
        type="range"
        min="1"
        max="40"
        step="1"
        [value]="selectedArtistsRange()"
        (input)="selectArtistsRange($event)"
      />
    </div>
  </div>
</form>
