<div
  class="genre-distribution-chart-visual genre-distribution-donut"
  role="img"
  [attr.aria-label]="chartAriaLabel()"
  [style.background]="chartBackground()"
>
  <div class="genre-distribution-donut-center" aria-hidden="true">
    <strong class="genre-distribution-donut-value">
      {{ matchedArtists() }}
    </strong>
    <span class="genre-distribution-donut-label"> artystów </span>
  </div>
</div>
