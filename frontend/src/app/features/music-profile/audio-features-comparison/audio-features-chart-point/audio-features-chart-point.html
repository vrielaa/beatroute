<svg:circle
  class="audio-features-comparison-point-hitbox"
  r="11"
  [attr.cx]="point().x"
  [attr.cy]="point().y"
  vector-effect="non-scaling-stroke"
/>
<svg:circle
  class="audio-features-comparison-point"
  r="4.5"
  [attr.cx]="point().x"
  [attr.cy]="point().y"
  [attr.stroke]="feature().color"
  vector-effect="non-scaling-stroke"
/>

@if (tooltip(); as tooltip) {
<svg:g
  class="audio-features-comparison-point-tooltip"
  [attr.transform]="'translate(' + tooltip.x + ' ' + tooltip.y + ')'"
  aria-hidden="true"
>
  <svg:rect
    class="audio-features-comparison-point-tooltip-bg"
    [attr.width]="tooltip.width"
    height="44"
    rx="12"
  />
  <svg:rect
    width="4"
    height="20"
    x="14"
    y="12"
    rx="2"
    [attr.fill]="tooltip.color"
  />
  <svg:text
    class="audio-features-comparison-point-tooltip-title"
    x="28"
    y="27"
    [attr.textLength]="tooltip.textLength"
    lengthAdjust="spacingAndGlyphs"
  >
    {{ tooltip.title }}
  </svg:text>
</svg:g>
}
