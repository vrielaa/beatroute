<p
  class="user-profile-display-name"
>
  {{ userName() }}
</p>

@if (profileImageUrl(); as imageUrl) {
<div class="user-profile-avatar">
  <img [src]="imageUrl" alt="User Profile Picture" class="user-profile-avatar-image" />
</div>
} @if (userEmail(); as email) {
<p
  class="user-profile-email"
>
  {{ email }}
</p>
}
